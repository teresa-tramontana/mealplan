# Lädt die App bei jedem Push auf main automatisch zu Cloudflare hoch.
# Braucht einmalig das GitHub-Secret CLOUDFLARE_API_TOKEN (Repo → Settings → Secrets and variables → Actions).
# Ohne Secret wird der Schritt einfach übersprungen (kein roter Fehler).
name: Cloudflare hochladen
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Hinweis, falls der Schlüssel fehlt
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN fehlt – nicht hochgeladen. Bitte als GitHub-Secret anlegen."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Zu Cloudflare hochladen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy
